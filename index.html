<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>그린비아 룰렛 이벤트</title>
<style>
body {
  text-align: center;
  font-family: Arial, sans-serif;
}

#wrapper {
  position: relative;
  width: 320px;
  margin: 30px auto;
}

#pointer {
  position: absolute;
  top: -5px;
  left: 145px;
  font-size: 35px;
  transform: rotate(180deg);
}

#wheel {
  width: 320px;
  height: 320px;
  border-radius: 50%;
  border: 8px solid #333;

  /* 🎯 좌우 대칭 색상 */
  background: conic-gradient(
    #ffffff 0deg 60deg,
    #8fd17f 60deg 120deg,
    #f9d85e 120deg 180deg,
    #ffffff 180deg 240deg,
    #8fd17f 240deg 300deg,
    #f9d85e 300deg 360deg
  );

  transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
  position: relative;
}

.prize {
  position: absolute;
  width: 100px;
  left: 110px;
  top: 145px;
  font-weight: bold;
  font-size: 14px;
  transform-origin: 50px 15px;
}

button {
  margin-top: 20px;
  padding: 15px 35px;
  font-size: 20px;
}

#result {
  margin-top: 25px;
  font-size: 24px;
  font-weight: bold;
}
</style>
</head>
<body>

<h1>🎁 그린비아 룰렛 이벤트 🎁</h1>
<p>룰렛을 돌려 사은품을 확인하세요!</p>

<div id="wrapper">
  <div id="pointer">▼</div>
  <div id="wheel">

    <!-- 흰색 (샘플팩) -->
    <div class="prize" style="transform: rotate(30deg) translateY(-120px);">샘플팩</div>

    <!-- 연두 (에너지젤) -->
    <div class="prize" style="transform: rotate(90deg) translateY(-120px);">에너지젤 1팩</div>

    <!-- 노랑 (프로틴밀) -->
    <div class="prize" style="transform: rotate(150deg) translateY(-120px);">프로틴밀 1팩</div>

    <!-- 흰색 -->
    <div class="prize" style="transform: rotate(210deg) translateY(-120px);">샘플팩</div>

    <!-- 연두 -->
    <div class="prize" style="transform: rotate(270deg) translateY(-120px);">에너지젤 1팩</div>

    <!-- 노랑 -->
    <div class="prize" style="transform: rotate(330deg) translateY(-120px);">프로틴밀 1팩</div>

  </div>
</div>

<button onclick="spin()">룰렛 돌리기</button>

<div id="result"></div>

<script>
const prizes = [
  "샘플팩",
  "에너지젤 1팩",
  "프로틴밀 1팩",
  "샘플팩",
  "에너지젤 1팩",
  "프로틴밀 1팩"
];

let spinning = false;
let currentRotation = 0;

function spin() {
  if (spinning) return;

  spinning = true;
  document.getElementById("result").innerText = "";

  const index = Math.floor(Math.random() * prizes.length);
  const segmentAngle = 360 / prizes.length;

  const stopAngle = 360 - (index * segmentAngle + segmentAngle / 2);
  const extraSpin = 360 * 5;

  currentRotation += extraSpin + stopAngle;

  document.getElementById("wheel").style.transform =
    `rotate(${currentRotation}deg)`;

  setTimeout(() => {
    document.getElementById("result").innerText =
      "👉 결과: " + prizes[index];
    spinning = false;
  }, 4200);
}
</script>

</body>
</html>
